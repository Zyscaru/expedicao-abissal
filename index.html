<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Jogo de Python intermediário: funções, dicionários, classes, exceções, recursão, geradores e algoritmos pilotando um submarino no fundo do mar.">
<meta name="theme-color" content="#03141e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Abissal">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<title>Expedição Abissal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Nunito+Sans:ital,opsz,wght@0,6..12,400;0,6..12,600;0,6..12,700;1,6..12,400&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: cabine do ARGO — briefing + editor à esquerda, janela de sonar fixa à direita.
   Visual único e escuro (fundo do mar com bioluminescência), escolhido de propósito. */
:root{
  color-scheme: dark;
  --bg:#03141e; --panel:#062433; --panel-2:#0a3043; --ink:#dcf3f1; --ink-soft:#84adb3; --line:#13445a;
  --water:#0a3a50; --water-2:#0c4159; --caustic:rgba(120,235,230,.07); --rock:#1d2a33; --rock-hi:#3a5463; --rock-lo:#121c23;
  --gold:#f5c451; --bubble:#bff3ff; --current:#5fe6da; --jelly:#e46cff; --eel:#9dff7a;
  --key-a:#ff9f6e; --key-b:#7ee0a1; --key-c:#c99bff;
  --accent:#ff7b5c; --accent-ink:#2a0c04; --cool:#48e5d6; --mark:#ffe066;
  --code-bg:#02101a; --code-fg:#d9f1ef; --code-dim:#6f949b; --key:#0b2b3b;
  --ok:#7ee0a1; --ok-bg:#0d3326; --err:#ff9c8a; --err-bg:#3a1714; --star:#ffd166; --star-off:#244a5a;
  --f-display:"Chakra Petch", "Trebuchet MS", system-ui, sans-serif;
  --f-body:"Nunito Sans", "Segoe UI", system-ui, sans-serif;
  --f-code:"JetBrains Mono", ui-monospace, Consolas, monospace;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:radial-gradient(1000px 380px at 80% -140px, #0c4a5e 0%, transparent 65%), radial-gradient(600px 300px at 0% 0%, #082f40 0%, transparent 70%), var(--bg);background-color:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
a{color:var(--cool)}
:focus-visible{outline:3px solid var(--cool);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;max-width:1340px;margin:0 auto;padding-block:14px 4px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.logo{display:flex;align-items:center;gap:10px;font-family:var(--f-display);font-weight:700;font-size:1.55rem;letter-spacing:.04em;text-transform:uppercase;line-height:1}
.logo div{white-space:nowrap}
.logo small{display:block;font-family:var(--f-body);font-weight:600;font-size:.7rem;letter-spacing:.16em;color:var(--ink-soft);margin-top:3px}
.logo svg{width:42px;height:42px;flex:none}
.top-r{display:flex;align-items:center;gap:8px}
.pill{display:flex;align-items:center;gap:6px;white-space:nowrap;border:1.5px solid var(--line);background:var(--panel);border-radius:99px;padding:6px 12px;font-weight:700;font-size:.9rem;font-variant-numeric:tabular-nums}
.pill .st{color:var(--star)}
.btn{border:1.5px solid var(--line);background:var(--panel-2);border-radius:10px;padding:9px 16px;font-weight:700;font-size:.92rem;min-height:42px;color:var(--ink)}
.btn:hover{border-color:var(--ink-soft)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--ink-soft);font-weight:600}
.btn:disabled{opacity:.5;cursor:not-allowed}

.wrap{max-width:1340px;margin:0 auto;padding-block:10px 40px;
  padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.game{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"mission board" "editor board";gap:16px;align-items:start}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:14px;min-width:0}
.mission{grid-area:mission;padding:20px 22px}
.boardcard{grid-area:board;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px);padding:14px;display:flex;flex-direction:column;gap:10px}
.edcol{grid-area:editor;display:flex;flex-direction:column;gap:10px;min-width:0}
.eyebrow{font-family:var(--f-display);font-weight:600;font-size:.82rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cool)}
.eyebrow .depth{color:var(--ink-soft);margin-left:6px}
h1{font-family:var(--f-display);font-weight:700;font-size:clamp(1.7rem,3vw,2.3rem);line-height:1.05;margin:6px 0 12px;letter-spacing:.01em;text-wrap:balance}
.mission p{margin:0 0 10px;max-width:64ch}
.mission code,.ref code{font-family:var(--f-code);font-size:.84em;background:var(--panel-2);padding:1px 5px;border-radius:4px;color:var(--ink)}
.mission pre,.ref pre{background:var(--code-bg);color:var(--code-fg);font-family:var(--f-code);font-size:.82rem;border-radius:10px;padding:10px 14px;margin:0 0 12px;overflow-x:auto;border:1px solid var(--line)}
.task{background:linear-gradient(135deg,#2c1410,#1d0e0b);border:1.5px solid var(--accent);border-radius:12px;padding:12px 14px;margin:6px 0 4px}
.task strong{display:block;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.12em;font-size:.8rem;color:var(--accent);margin-bottom:4px}
.task p{margin:0}
details.ref{margin-top:12px;border:1.5px solid var(--line);border-radius:12px;background:var(--panel-2)}
details.ref summary{cursor:pointer;padding:10px 14px;font-family:var(--f-display);font-weight:600;letter-spacing:.08em;text-transform:uppercase;font-size:.85rem;color:var(--ink-soft);list-style:none}
details.ref summary::-webkit-details-marker{display:none}
details.ref summary::before{content:"▸ ";color:var(--cool)}
details.ref[open] summary::before{content:"▾ "}
.refbody{padding:0 14px 12px;display:flex;flex-direction:column;gap:10px;font-size:.88rem}
.refbody pre{margin:4px 0 0}
.reftab{display:grid;grid-template-columns:auto auto 1fr;gap:4px 10px;align-items:baseline;margin-top:4px}
.reftab code{white-space:nowrap}
.reftab span.t{font-family:var(--f-code);font-size:.76rem;color:var(--cool)}
.acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:4px}
.acts span{font-family:var(--f-code);font-size:.8rem;border:1px solid var(--line);border-radius:6px;padding:2px 7px;background:var(--panel)}
.goal{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:.85rem;color:var(--ink-soft);margin-top:10px}
.goal b{color:var(--ink)}

/* editor */
.editor{background:var(--code-bg);border-radius:14px;overflow:hidden;border:1.5px solid var(--line)}
.ed-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 12px 9px 16px;border-bottom:1px solid var(--line);color:var(--code-dim);font-family:var(--f-code);font-size:.78rem}
.ed-body{display:grid;grid-template-columns:42px 1fr;min-height:260px;max-height:62vh;overflow:auto}
.gutter{padding:12px 8px 12px 0;text-align:right;font-family:var(--f-code);font-size:.86rem;line-height:1.6;color:#3f6670;user-select:none;white-space:pre;font-variant-numeric:tabular-nums}
#code{background:transparent;color:var(--code-fg);border:0;resize:none;outline:none;padding:12px 12px 12px 10px;font-family:var(--f-code);font-size:.86rem;line-height:1.6;white-space:pre;overflow:hidden;tab-size:4;caret-color:var(--accent);min-height:260px;width:100%}
.keys{display:flex;gap:6px;overflow-x:auto;padding:8px;border-top:1px solid var(--line);scrollbar-width:none}
.keys::-webkit-scrollbar{display:none}
.keys button{flex:0 0 auto;min-width:40px;height:40px;padding:0 10px;border:0;border-radius:8px;background:var(--key);color:var(--code-fg);font-family:var(--f-code);font-size:.88rem}
.keys button:active{background:var(--line)}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.speed{display:flex;border:1.5px solid var(--line);border-radius:10px;overflow:hidden;margin-left:auto}
.speed button{border:0;background:var(--panel);padding:8px 10px;font-size:.8rem;font-weight:700;color:var(--ink-soft)}
.speed button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.feedback{border-radius:12px;padding:12px 14px;font-size:.93rem;display:flex;flex-direction:column;gap:6px;overflow-wrap:anywhere}
.feedback.ok{background:var(--ok-bg);color:var(--ok);border:1.5px solid var(--ok)}
.feedback.bad{background:var(--err-bg);color:var(--err);border:1.5px solid var(--err)}
.feedback b{font-family:var(--f-display);font-size:1.02rem;letter-spacing:.06em;text-transform:uppercase}
.feedback .row{display:flex;gap:8px;flex-wrap:wrap}
.feedback .btn{font-size:.85rem;padding:6px 12px;min-height:36px}
.hint{color:var(--ink);background:var(--panel);border-radius:8px;padding:8px 10px;font-size:.86rem;white-space:pre-wrap}
.solution{background:var(--code-bg);color:var(--code-fg);border-radius:8px;padding:10px 12px;font-family:var(--f-code);font-size:.8rem;white-space:pre;overflow-x:auto;margin:0;border:1px solid var(--line);max-height:360px}

/* sonar */
.bhead{display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap;font-size:.82rem;color:var(--ink-soft);font-variant-numeric:tabular-nums;font-family:var(--f-code)}
.bhead b{color:var(--ink)}
.o2{display:inline-flex;align-items:center;gap:4px}
.o2 i{display:inline-block;width:46px;height:9px;border:1.5px solid var(--ink-soft);border-radius:5px;position:relative;overflow:hidden}
.o2 i::after{content:"";position:absolute;inset:0;width:var(--b,100%);background:var(--bubble);transition:width .2s}
.o2.low i::after{background:var(--accent)}
.maps{display:flex;gap:6px;flex-wrap:wrap}
.maps button{border:1.5px solid var(--line);background:var(--panel-2);border-radius:8px;padding:3px 9px;font-size:.76rem;font-weight:700;color:var(--ink-soft)}
.maps button[aria-current="true"]{border-color:var(--ink);color:var(--ink)}
.maps button.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-bg)}
.maps button.bad{border-color:var(--err);color:var(--err);background:var(--err-bg)}
.stage{position:relative;display:grid;place-items:center;background:radial-gradient(ellipse at 50% 0%, #0d4459 0%, #041b27 75%);border-radius:12px;padding:10px;overflow:hidden;min-height:200px;border:1px solid var(--line)}
.stage::before{content:"";position:absolute;inset:0;background:repeating-radial-gradient(circle at 50% 120%, transparent 0 38px, rgba(72,229,214,.05) 38px 39px);pointer-events:none}
.board{position:relative;display:grid;gap:0;border-radius:6px;overflow:hidden}
.cell{width:var(--c);height:var(--c);position:relative}
.cell.w{background:var(--water);background-image:radial-gradient(circle at 30% 30%, var(--caustic) 0 22%, transparent 23%),radial-gradient(circle at 75% 70%, var(--caustic) 0 14%, transparent 15%)}
.cell.w.alt{background-color:var(--water-2)}
.cell.r{background:var(--rock-lo)}
.cell.r::after{content:"";position:absolute;inset:3%;background:linear-gradient(150deg,var(--rock-hi),var(--rock) 50%,var(--rock-lo));clip-path:polygon(4% 40%,20% 8%,48% 4%,74% 14%,96% 38%,92% 78%,66% 96%,30% 94%,6% 74%);border-radius:30%}
.cell.r.v2::after{clip-path:polygon(8% 22%,36% 4%,70% 8%,94% 30%,96% 66%,76% 94%,38% 96%,6% 78%,2% 48%)}
.cell.r.v3::after{clip-path:polygon(2% 56%,14% 18%,44% 6%,82% 10%,98% 42%,88% 84%,52% 98%,18% 90%)}
.cur{position:absolute;inset:0;display:grid;place-items:center;color:var(--current);font-family:var(--f-code);font-weight:700;font-size:calc(var(--c)*.5);transform:rotate(var(--r));opacity:.85}
.cur span{animation:flow 1.1s linear infinite}
@keyframes flow{0%{transform:translateX(-18%);opacity:.55}50%{opacity:1}100%{transform:translateX(18%);opacity:.55}}
.gem{position:absolute;left:50%;top:50%;width:46%;height:46%;transform:translate(-50%,-50%) rotate(45deg);background:linear-gradient(135deg,#fff3c4,var(--gold) 45%,#b8861f);border-radius:3px;box-shadow:0 0 12px rgba(245,196,81,.6);transition:transform .3s, opacity .3s;z-index:2}
.gem.got{transform:translate(-50%,-170%) rotate(45deg) scale(.3);opacity:0}
.bub{position:absolute;inset:0;z-index:1}
.bub i{position:absolute;border-radius:50%;border:2px solid var(--bubble);background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.6) 0 18%,rgba(191,243,255,.18) 20%);animation:rise 2.4s ease-in-out infinite}
.bub i:nth-child(1){width:42%;height:42%;left:14%;top:38%}
.bub i:nth-child(2){width:26%;height:26%;left:56%;top:22%;animation-delay:.6s}
.bub i:nth-child(3){width:18%;height:18%;left:58%;top:62%;animation-delay:1.2s}
@keyframes rise{50%{transform:translateY(-10%)}}
.kk{position:absolute;inset:18%;border-radius:50%;border:3px solid var(--k);display:grid;place-items:center;font-family:var(--f-display);font-weight:700;font-size:calc(var(--c)*.32);color:var(--k);box-shadow:0 0 10px var(--k);z-index:2;transition:transform .3s,opacity .3s}
.kk.got{transform:translateY(-70%) scale(.3);opacity:0}
.door{position:absolute;inset:6%;border-radius:4px;background:repeating-linear-gradient(90deg,var(--k) 0 12%,transparent 12% 25%);border:2px solid var(--k);display:grid;place-items:center;transition:opacity .4s}
.door b{background:var(--bg);color:var(--k);font-family:var(--f-display);font-size:calc(var(--c)*.32);padding:0 3px;border-radius:3px;line-height:1.2}
.door.open{opacity:.25}
.jelly,.eel{position:absolute;width:var(--c);height:var(--c);z-index:3;pointer-events:none}
.jelly svg,.eel svg{width:100%;height:100%;filter:drop-shadow(0 0 6px var(--jelly))}
.eel svg{filter:drop-shadow(0 0 6px var(--eel))}
.eel{transition:transform var(--spd,180ms) ease-in-out}
.flag{position:absolute;inset:4%;z-index:1}
.cell .hl{position:absolute;inset:6%;border:3px solid var(--mark);border-radius:6px;box-shadow:0 0 calc(var(--c)*.25) var(--mark);z-index:4;animation:pulse 1.2s infinite}
@keyframes pulse{50%{opacity:.45}}
.robot{position:absolute;left:0;top:0;width:var(--c);height:var(--c);z-index:5;transition:transform var(--spd,180ms) ease-in-out}
.robot svg{width:100%;height:100%;transition:transform var(--spd,180ms) ease-in-out;filter:drop-shadow(0 2px 3px rgba(0,0,0,.5))}
.robot.crash svg{animation:shake .35s}
.robot.breath svg{filter:drop-shadow(0 0 10px var(--bubble))}
@keyframes shake{0%,100%{translate:0}25%{translate:-8% 0}75%{translate:8% 0}}
.boom{position:absolute;width:var(--c);height:var(--c);border-radius:50%;background:radial-gradient(circle,#fff,var(--accent) 40%,transparent 70%);opacity:.85;z-index:6;animation:fade 1s forwards}
@keyframes fade{to{opacity:0}}
.dados{font-family:var(--f-code);font-size:.82rem;color:var(--code-fg);background:var(--code-bg);border:1px solid var(--line);border-radius:10px;padding:12px 14px;max-width:100%;overflow-x:auto;line-height:1.7;white-space:nowrap}
.dados .lbl{display:block;font-family:var(--f-display);font-size:.72rem;letter-spacing:.14em;text-transform:uppercase;color:var(--cool);margin-bottom:4px;white-space:normal}
.overlay{position:absolute;inset:0;display:grid;place-items:center;background:rgba(3,20,30,.82);z-index:10;padding:16px}
.win{background:var(--panel);border:2px solid var(--accent);border-radius:16px;padding:18px 20px;text-align:center;max-width:340px;display:flex;flex-direction:column;gap:8px;align-items:center}
.win b{font-family:var(--f-display);font-size:1.5rem;text-transform:uppercase;letter-spacing:.04em}
.stars{display:flex;gap:4px;font-size:2rem;line-height:1}
.stars span{color:var(--star-off)}
.stars span.on{color:var(--star)}
.win .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin-top:4px}
.out{font-family:var(--f-code);font-size:.78rem;color:var(--ink-soft);white-space:pre-wrap;max-height:90px;overflow:auto;border-top:1px dashed var(--line);padding-top:6px}
.out:empty{display:none}
.note{font-size:.84rem;color:var(--ink-soft);overflow-wrap:anywhere}
.note:empty{display:none}
.legend{display:flex;gap:6px 12px;flex-wrap:wrap;font-size:.76rem;color:var(--ink-soft)}
.legend span{display:flex;align-items:center;gap:5px}
.legend i{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}

/* mapa de zonas */
.levels{display:flex;flex-direction:column;gap:14px}
.world{padding:18px 20px;display:grid;grid-template-columns:86px minmax(0,1fr);gap:4px 18px}
.world .prof{grid-row:1 / span 3;font-family:var(--f-display);font-weight:700;color:var(--cool);font-size:1.25rem;line-height:1.1;font-variant-numeric:tabular-nums;border-right:2px dashed var(--line);padding-right:12px}
.world .prof small{display:block;font-size:.7rem;letter-spacing:.14em;color:var(--ink-soft);font-weight:600}
.world h2{font-family:var(--f-display);margin:0;font-size:1.35rem;letter-spacing:.02em}
.world h2 span{color:var(--ink-soft);text-transform:uppercase;letter-spacing:.1em;font-size:.85rem;margin-right:8px}
.world p{margin:0 0 10px;color:var(--ink-soft);font-size:.92rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:4px;text-align:left;border:1.5px solid var(--line);background:var(--panel-2);border-radius:12px;padding:10px 12px;color:var(--ink)}
.tile:hover:not(:disabled){border-color:var(--ink-soft)}
.tile .n{font-family:var(--f-display);font-size:.78rem;color:var(--ink-soft);letter-spacing:.12em}
.tile b{font-size:.98rem;line-height:1.2}
.tile .s{font-size:1rem;letter-spacing:2px}
.tile .s span{color:var(--star-off)} .tile .s span.on{color:var(--star)}
.tile:disabled{opacity:.5;cursor:not-allowed}
.tile.next{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
.intro-card{padding:20px 22px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.intro-card p{margin:0;max-width:66ch}
.intro-card .pre{font-size:.86rem;color:var(--ink-soft);margin-top:6px}
.loading{font-size:.8rem;color:var(--code-dim)}

@media (max-width:1020px){
  .game{grid-template-columns:minmax(0,1fr);grid-template-areas:"mission" "board" "editor"}
  .boardcard{position:static}
}
@media (max-width:600px){
  .mission{padding:16px}
  .top{gap:8px}
  .logo{font-size:1rem;gap:8px;min-width:0}
  .logo div{white-space:normal;line-height:1.05}
  .pill{padding:5px 9px}
  .logo svg{width:34px;height:34px}
  .logo small{display:none}
  .top .btn{padding:8px 12px}
  #code,.gutter{font-size:15px}
  .actions .btn{flex:1}
  .speed{margin-left:0;width:100%}
  .speed button{flex:1}
  .reftab{grid-template-columns:auto 1fr}
  .stage{min-height:280px}
  .overlay{overflow:auto;padding:10px}
  .win{padding:12px 14px;gap:6px}
  .win b{font-size:1.2rem}
  .stars{font-size:1.6rem}
  .reftab span.t{display:none}
  .world{grid-template-columns:minmax(0,1fr)}
  .world .prof{grid-row:auto;border-right:0;padding-right:0;font-size:1rem}
  .world .prof small{display:inline;margin-right:6px}
}
@media (pointer:fine) and (min-width:1021px){.keys{display:none}}
@media (prefers-reduced-motion:reduce){.robot,.robot svg,.gem,.eel,.kk{transition:none}.robot.crash svg,.cell .hl,.cur span,.bub i{animation:none}}
</style>
</head>
<body>


<header class="top">

<script>
/* Expedição Abissal — motor do jogo e ponte com o Python do aluno (Skulpt) */
const DIRS = { N:0, L:1, S:2, O:3 }, DNOME = "NLSO";
const DX = [0, 1, 0, -1], DY = [-1, 0, 1, 0];
const CORRENTES = { ">":"L", "<":"O", "^":"N", "v":"S" };

function rng(seed){ let a = seed >>> 0; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function labirinto(w, h, seed, abrir = 0){
  const R = rng(seed); const W = w * 2 + 1, H = h * 2 + 1;
  const g = Array.from({length:H}, () => Array(W).fill("#"));
  const seen = Array.from({length:h}, () => Array(w).fill(false));
  const stack = [[0, 0]]; seen[0][0] = true; g[1][1] = ".";
  while (stack.length){
    const [cx, cy] = stack[stack.length - 1];
    const viz = [[1,0],[-1,0],[0,1],[0,-1]].map(([dx, dy]) => [cx + dx, cy + dy, dx, dy]).filter(([nx, ny]) => nx >= 0 && ny >= 0 && nx < w && ny < h && !seen[ny][nx]);
    if (!viz.length){ stack.pop(); continue; }
    const [nx, ny, dx, dy] = viz[Math.floor(R() * viz.length)];
    seen[ny][nx] = true; g[cy * 2 + 1 + dy][cx * 2 + 1 + dx] = "."; g[ny * 2 + 1][nx * 2 + 1] = "."; stack.push([nx, ny]);
  }
  let tries = 0;
  while (abrir > 0 && tries++ < 800){
    const x = 1 + Math.floor(R() * (W - 2)), y = 1 + Math.floor(R() * (H - 2));
    if (g[y][x] !== "#") continue;
    const hor = g[y][x-1] !== "#" && g[y][x+1] !== "#" && g[y-1][x] === "#" && g[y+1][x] === "#";
    const ver = g[y-1][x] !== "#" && g[y+1][x] !== "#" && g[y][x-1] === "#" && g[y][x+1] === "#";
    if (hor || ver){ g[y][x] = "."; abrir--; }
  }
  return g;
}
// corredor sinuoso feito de segmentos, sempre virando à direita
function trilha(segs, marcas = {}){
  let x = 0, y = 0, d = DIRS.L; const cells = [[0, 0]];
  segs.forEach(len => { for (let k = 0; k < len; k++){ x += DX[d]; y += DY[d]; cells.push([x, y]); } d = (d + 1) % 4; });
  const mx = Math.min(...cells.map(c => c[0])), my = Math.min(...cells.map(c => c[1]));
  const W = Math.max(...cells.map(c => c[0])) - mx + 3, H = Math.max(...cells.map(c => c[1])) - my + 3;
  const g = Array.from({length:H}, () => Array(W).fill("#"));
  cells.forEach(([cx, cy], i) => { g[cy - my + 1][cx - mx + 1] = i === cells.length - 1 ? "@" : (marcas[i] || "."); });
  return { grid: g.map(r => r.join("")), start: [1 - mx, 1 - my] };
}

/* ---------- simulação ---------- */
class Falha extends Error {}
class Sim {
  constructor(map, cfg = {}){
    this.grid = map.grid.map(r => r.split(""));
    this.h = this.grid.length; this.w = this.grid[0].length;
    [this.x, this.y] = map.start; this.dir = DIRS.L; this.cfg = cfg;
    this.tesouros = new Set(); this.chaves = new Set(); this.total = 0;
    this.grid.forEach((row, y) => row.forEach((c, x) => {
      if (c === "$"){ this.tesouros.add(x + "," + y); this.total++; }
      if (c === "@") this.base = [x, y];
    }));
    this.o2 = cfg.oxigenio || 0; this.o2max = cfg.oxigenio || 0;
    this.criaturas = (map.criaturas || []).map(p => Array.isArray(p) ? { path: p, i: 0, d: 1 } : { path: p.path, i: p.i || 0, d: p.d || 1 });
    this.trace = []; this.ticks = 0; this.coletados = [];
  }
  tile(x, y){ return (y < 0 || x < 0 || y >= this.h || x >= this.w) ? "#" : this.grid[y][x]; }
  bloqueado(x, y){
    const t = this.tile(x, y);
    if (t === "#" || t === "|" || t === "X") return true;
    if (t >= "A" && t <= "C") return !this.chaves.has(t.toLowerCase());
    return false;
  }
  posCriaturas(){ return this.criaturas.map(c => c.path[c.i]); }
  proximasCriaturas(){ return this.criaturas.map(c => { if (c.path.length < 2) return c.path[0]; let i = c.i + c.d; if (i < 0 || i >= c.path.length) i = c.i - c.d; return c.path[i]; }); }
  moverCriaturas(antes){
    const velhas = this.posCriaturas();
    for (const c of this.criaturas){ if (c.path.length < 2) continue; if (c.i + c.d < 0 || c.i + c.d >= c.path.length) c.d = -c.d; c.i += c.d; }
    const novas = this.posCriaturas();
    if (novas.length) this.trace.push({ t:"cri", pos: novas.map(p => p.slice()) });
    novas.forEach((p, k) => {
      const choque = (p[0] === this.x && p[1] === this.y) || (antes && velhas[k][0] === this.x && velhas[k][1] === this.y && p[0] === antes[0] && p[1] === antes[1]);
      if (choque){ this.trace.push({ t:"hit" }); throw new Falha("Uma criatura atingiu o submarino!"); }
    });
  }
  pegar(){
    const k = this.x + "," + this.y, t = this.tile(this.x, this.y);
    if (this.tesouros.has(k)){ this.tesouros.delete(k); this.coletados.push([this.y, this.x]); this.trace.push({ t:"pick", x:this.x, y:this.y }); }
    if (t >= "a" && t <= "c" && !this.chaves.has(t)){ this.chaves.add(t); this.trace.push({ t:"key", x:this.x, y:this.y, k:t }); }
  }
  mover(d){
    const nx = this.x + DX[d], ny = this.y + DY[d];
    this.dir = d;
    if (this.bloqueado(nx, ny)){
      if (this.cfg.parar){ this.trace.push({ t:"bump", d }); return; }
      const t = this.tile(nx, ny);
      this.trace.push({ t:"crash", x:nx, y:ny, d });
      throw new Falha(t >= "A" && t <= "C" ? `A porta ${t} está trancada: falta a chave ${t.toLowerCase()}.` : "O submarino bateu numa rocha!");
    }
    if (this.o2max){ if (this.o2 <= 0){ this.trace.push({ t:"empty" }); throw new Falha("O oxigênio acabou!"); } this.o2--; }
    this.x = nx; this.y = ny; this.trace.push({ t:"move", x:nx, y:ny, d, o2:this.o2 });
    this.pegar();
    const c = CORRENTES[this.tile(nx, ny)];
    if (c){
      const cd = DIRS[c], px = nx + DX[cd], py = ny + DY[cd];
      if (!this.bloqueado(px, py)){ this.x = px; this.y = py; this.trace.push({ t:"push", x:px, y:py }); this.pegar(); }
    }
  }
  acao(a){
    this.ticks++;
    const antes = [this.x, this.y];
    if (a in DIRS) this.mover(DIRS[a]);
    else if (a === "P") this.trace.push({ t:"wait" });
    else if (a === "R"){
      if (this.tile(this.x, this.y) !== "o") throw new Falha("Só dá para respirar ('R') em cima de uma bolha de ar.");
      this.o2 = this.o2max; this.trace.push({ t:"breath", o2:this.o2 });
    }
    else throw new Falha(`"${a}" não é uma ação válida. Use "N", "S", "L", "O"${this.o2max ? ', "R" (respirar)' : ""} ou "P" (esperar).`);
    if (this.criaturas.length) this.moverCriaturas(antes);
  }
  chegou(){ return this.x === this.base[0] && this.y === this.base[1]; }
  completo(){ return this.chegou() && this.tesouros.size === 0; }
}
// referência em JS: menor número de comandos até o destino, aplicando correntes (sem portas)
function proximaPos(grid, x, y, d, chaves){
  const blk = (xx, yy) => { const t = grid[yy] && grid[yy][xx]; if (!t || t === "#" || t === "|" || t === "X") return true; if (t >= "A" && t <= "C") return !(chaves && chaves.has(t.toLowerCase())); return false; };
  let nx = x + DX[d], ny = y + DY[d];
  if (blk(nx, ny)) return null;
  const c = CORRENTES[grid[ny][nx]];
  if (c){ const cd = DIRS[c]; if (!blk(nx + DX[cd], ny + DY[cd])){ nx += DX[cd]; ny += DY[cd]; } }
  return [nx, ny];
}
function menorRota(grid, sx, sy, tx, ty){
  const seen = new Set([sx + "," + sy]), q = [[sx, sy, 0]];
  while (q.length){ const [x, y, n] = q.shift(); if (x === tx && y === ty) return n;
    for (let d = 0; d < 4; d++){ const p = proximaPos(grid, x, y, d); if (!p) continue; const k = p[0] + "," + p[1]; if (seen.has(k)) continue; seen.add(k); q.push([p[0], p[1], n + 1]); } }
  return -1;
}
function menorRotaChaves(grid, sx, sy){
  const key = (x, y, ks) => x + "," + y + "," + [...ks].sort().join("");
  const q = [[sx, sy, new Set(), 0]], seen = new Set([key(sx, sy, new Set())]);
  while (q.length){
    const [x, y, ks, n] = q.shift();
    if (grid[y][x] === "@") return n;
    for (let d = 0; d < 4; d++){
      const p = proximaPos(grid, x, y, d, ks); if (!p) continue;
      const nk = new Set(ks); const t = grid[p[1]][p[0]]; if (t >= "a" && t <= "c") nk.add(t);
      const k = key(p[0], p[1], nk); if (seen.has(k)) continue; seen.add(k); q.push([p[0], p[1], nk, n + 1]);
    }
  }
  return -1;
}

/* ---------- ponte com o Python do aluno ---------- */
const PRELUDIO_PY = `class Sonar:
    def posicao(self):
        return tuple(_sonda("posicao"))
    def livre(self, direcao):
        return _sonda("livre", direcao)
    def oxigenio(self):
        return _sonda("oxigenio")
    def oxigenio_maximo(self):
        return _sonda("oxigenio_maximo")
    def na_bolha(self):
        return _sonda("na_bolha")
    def na_base(self):
        return _sonda("na_base")
    def criaturas_agora(self):
        return set(tuple(p) for p in _sonda("criaturas_agora"))
    def criaturas_proximo_turno(self):
        return set(tuple(p) for p in _sonda("criaturas_proximo"))
    def mapa(self):
        return _sonda("mapa")
`;
let LINHAS_PRELUDIO = PRELUDIO_PY.split("\n").length - 1, LINHAS_ALUNO = 1e9;
class ErroAluno extends Error { constructor(info){ super(info.msg); this.info = info; } }

function toJS(v, depth = 0){
  if (depth > 40) return null;
  if (v === undefined || v === null || v === Sk.builtin.none.none$) return null;
  if (v === Sk.builtin.bool.true$) return true;
  if (v === Sk.builtin.bool.false$) return false;
  if (v instanceof Sk.builtin.int_) return Number(v.v);
  if (v instanceof Sk.builtin.float_) return v.v;
  if (v instanceof Sk.builtin.str) return v.v;
  if (v instanceof Sk.builtin.list || v instanceof Sk.builtin.tuple) return v.v.map(x => toJS(x, depth + 1));
  if (v instanceof Sk.builtin.dict){
    const out = []; const it = Sk.abstr.iter(v);
    for (let k = it.tp$iternext(); k !== undefined; k = it.tp$iternext()) out.push([toJS(k, depth + 1), toJS(Sk.abstr.objectGetItem(v, k), depth + 1)]);
    return { __dict: out };
  }
  if (v instanceof Sk.builtin.set || v instanceof Sk.builtin.frozenset || v instanceof Sk.builtin.generator){
    const it = Sk.abstr.iter(v); const out = [];
    for (let x = it.tp$iternext(), n = 0; x !== undefined && n < 5000; x = it.tp$iternext(), n++) out.push(toJS(x, depth + 1));
    return v instanceof Sk.builtin.generator ? out : { __set: out };
  }
  return v;
}
const py = (v) => Sk.ffi.remapToPy(v);
const tup = (arr) => new Sk.builtin.tuple(arr.map(x => Array.isArray(x) ? tup(x) : py(x)));

function infoErro(e){
  if (e instanceof ErroAluno) return e.info;
  if (e instanceof Sk.builtin.BaseException){
    const nome = e.tp$name || Sk.abstr.typeName(e);
    let msg = "";
    try { msg = toJS(e.args)[0]; } catch (_){}
    if (msg === undefined || msg === null) msg = "";
    let line = null;
    const tb = e.traceback || [];
    for (const fr of tb){ if (fr && fr.lineno){ line = fr.lineno - LINHAS_PRELUDIO; break; } }
    if (line !== null && (line < 1 || line > LINHAS_ALUNO)) line = null;
    const kind = /SyntaxError|IndentationError|TabError/.test(nome) ? "compile" : /TimeoutError|TimeLimitError/.test(nome) ? "timeout" : "exception";
    return { kind, cls: nome, msg: String(msg), line, texto: `${nome}${msg !== "" ? ": " + msg : ""}` };
  }
  if (e instanceof RangeError) return { kind:"exception", cls:"RecursionError", msg:"recursão profunda demais", line:null, texto:"RecursionError: recursão profunda demais" };
  return { kind:"internal", msg: String(e && e.message || e) };
}

function criarCtl(mod){
  const g = mod.$d;
  const chamar = (fn, args) => { Sk.execStart = Date.now(); return Sk.misceval.callsimArray(fn, args); };
  return {
    toJS, py, tup,
    tem: (n) => !!g[n],
    ehClasse: (n) => !!g[n] && Sk.builtin.checkClass(g[n]),
    ehFuncao: (n) => !!g[n] && g[n] instanceof Sk.builtin.func,
    subclasse: (a, b) => !!g[a] && !!g[b] && Sk.misceval.isTrue(Sk.builtin.issubclass(g[a], g[b])),
    exige(nome, tipo){
      if (!g[nome]) throw new ErroAluno({ kind:"compile", msg:`não encontrei ${tipo === "classe" ? "a classe" : "a função"} ${nome}. O nome precisa ser exatamente esse (maiúsculas contam)` });
      if (tipo === "classe" && !Sk.builtin.checkClass(g[nome])) throw new ErroAluno({ kind:"compile", msg:`${nome} precisa ser uma classe (class ${nome}:)` });
      if (tipo === "funcao" && Sk.builtin.checkClass(g[nome])) throw new ErroAluno({ kind:"compile", msg:`${nome} precisa ser uma função (def ${nome}(...):)` });
    },
    criar: (n, args) => chamar(g[n], args || []),
    funcao: (n, args) => chamar(g[n], args || []),
    metodo: (obj, nome, args) => chamar(Sk.abstr.gattr(obj, new Sk.builtin.str(nome)), args || []),
    attr: (obj, nome) => Sk.abstr.gattr(obj, new Sk.builtin.str(nome)),
    builtin: (n, args) => chamar(Sk.builtins[n], args || []),
    texto: (v) => Sk.ffi.remapToJs(new Sk.builtin.str(v)),
    repr: (v) => Sk.ffi.remapToJs(Sk.builtin.repr(v)),
    lista: (arr) => new Sk.builtin.list(arr),
    global: (n) => g[n],
    instancia: (v, n) => !!g[n] && Sk.misceval.isTrue(Sk.builtin.isinstance(v, g[n])),
    nomeTipo: (v) => Sk.abstr.typeName(v),
    excecao(fn){
      try { fn(); return null; }
      catch (e){ if (e instanceof Sk.builtin.BaseException){ const i = infoErro(e); i.obj = e; i.eh = (n) => !!g[n] && Sk.misceval.isTrue(Sk.builtin.isinstance(e, g[n])); return i; } throw e; }
    },
    falha: (msg) => { throw new ErroAluno({ kind:"compile", msg }); },
  };
}
function sonarHost(sim){
  return new Sk.builtin.func(function(nome, arg){
    const n = toJS(nome);
    switch (n){
      case "posicao": return tup([sim.y, sim.x]);
      case "livre": {
        const d = toJS(arg);
        if (!(d in DIRS)) throw new Sk.builtin.ValueError(`direção inválida "${d}": use "N", "S", "L" ou "O"`);
        return py(!sim.bloqueado(sim.x + DX[DIRS[d]], sim.y + DY[DIRS[d]]));
      }
      case "oxigenio": return py(sim.o2);
      case "oxigenio_maximo": return py(sim.o2max);
      case "na_bolha": return py(sim.tile(sim.x, sim.y) === "o");
      case "na_base": return py(sim.chegou());
      case "criaturas_agora": return py(sim.posCriaturas().map(([x, y]) => [y, x]));
      case "criaturas_proximo": return py(sim.proximasCriaturas().map(([x, y]) => [y, x]));
      case "mapa": return py(sim.grid.map(r => r.join("")));
    }
    throw new Sk.builtin.AttributeError(n);
  });
}

function rodar(missao, idx, codigo, seed){
  const caso = missao.casos[idx];
  const sim = caso.map ? new Sim(caso.map, Object.assign({}, missao.cfg || {}, caso.cfg || {})) : null;
  let out = "", res = null, err = null; const extra = {};
  Sk.configure({ output: t => { if (out.length < 20000) out += t; }, read: x => { if (!Sk.builtinFiles || !Sk.builtinFiles.files[x]) throw "arquivo não encontrado: " + x; return Sk.builtinFiles.files[x]; },
    __future__: Sk.python3, execLimit: 4000, inputfun: () => { throw new Sk.builtin.RuntimeError("input() não funciona na expedição: os dados chegam pelos parâmetros"); }, inputfunTakesPrompt: true });
  Sk.builtins._sonda = sim ? sonarHost(sim) : new Sk.builtin.func(() => Sk.builtin.none.none$);
  try {
    Sk.execStart = Date.now();
    const pre = PRELUDIO_PY + (missao.preludio || "");
    LINHAS_PRELUDIO = pre.split("\n").length - 1; LINHAS_ALUNO = codigo.split("\n").length;
    const mod = Sk.importMainWithBody("<stdin>", false, pre + codigo + "\n" + (missao.posludio || ""), false);
    const ctl = criarCtl(mod);
    try { res = missao.rodar(ctl, sim, caso, extra); }
    catch (e){ if (e instanceof Falha) res = { ok:false, msg: e.message }; else throw e; }
  } catch (e){ err = infoErro(e); }
  return { sim, out, err, res: err ? null : res, extra };
}
function rodarPiloto(ctl, sim, nomeClasse, maxTurnos){
  ctl.exige(nomeClasse, "classe");
  const p = ctl.criar(nomeClasse, []);
  const sonar = ctl.criar("Sonar", []);
  for (let t = 0; t < maxTurnos && !sim.completo(); t++){
    const a = toJS(ctl.metodo(p, "agir", [sonar]));
    if (typeof a !== "string") return { ok:false, msg:`agir precisa devolver um texto com a ação, como "L", mas devolveu ${a === null ? "None" : JSON.stringify(a)}.` };
    sim.acao(a);
  }
  if (!sim.completo()) return { ok:false, msg: sim.tesouros.size ? `Depois de ${maxTurnos} turnos, ainda faltavam ${sim.tesouros.size} tesouro(s).` : `Depois de ${maxTurnos} turnos, o submarino não tinha chegado à base.` };
  return { ok:true };
}
function executarRota(sim, movs, exigirCompleto = true){
  if (!Array.isArray(movs)) return { ok:false, msg:`a rota precisa ser uma lista de movimentos, mas veio ${movs === null ? "None" : typeof movs}.` };
  for (const m of movs){ if (typeof m !== "string") return { ok:false, msg:`cada movimento precisa ser um texto como "L", mas encontrei ${JSON.stringify(m)}.` }; sim.acao(m); }
  if (exigirCompleto && !sim.chegou()) return { ok:false, msg:"A rota terminou, mas o submarino não chegou à base." };
  if (exigirCompleto && sim.tesouros.size) return { ok:false, msg:`O submarino chegou à base, mas ficaram ${sim.tesouros.size} tesouro(s) para trás.` };
  return { ok:true };
}
function linhasDeCodigo(code){
  return code.split("\n").map(l => l.trim()).filter(t => t && !t.startsWith("#") && !t.startsWith("import ") && !t.startsWith("from ") && !t.startsWith("@")).length;
}

/* Expedição Abissal — zonas e missões */
const ZONAS = [
  { titulo: "Recife raso", ideia: "Funções e listas: transformar ordens em movimentos e simular a rota antes de mergulhar." },

function pyfmt(v){

  if (typeof v === "string") return "'" + v.replace(/\\/g, "\\\\").replace(/'/g, "\\'") + "'";
  if (typeof v === "number") return Number.isInteger(v) ? String(v) : String(+v.toFixed(4));
  if (Array.isArray(v)) return "[" + v.map(pyfmt).join(", ") + "]";
  if (v.__tuple) return "(" + v.__tuple.map(pyfmt).join(", ") + (v.__tuple.length === 1 ? "," : "") + ")";

function espiralJS(h, w){
  const out = []; let t = 0, b = h - 1, l = 0, r = w - 1;
  while (t <= b && l <= r){
    for (let c = l; c <= r; c++) out.push([t, c]);
    for (let y = t + 1; y <= b; y++) out.push([y, r]);
    if (t < b) for (let c = r - 1; c >= l; c--) out.push([b, c]);
    if (l < r) for (let y = b - 1; y > t; y--) out.push([y, l]);

}

{ id: "a3", zona: 0, titulo: "Simulador de correntes",
  intro: `<p>Antes de arriscar o ARGO, a equipe quer simular a rota no computador. O mapa chega como uma lista de strings: <code>mapa[linha][coluna]</code> é a casa. <code>"#"</code> é rocha; o resto é água.</p>

  <pre>PASSO = {"N": (-1, 0), "S": (1, 0), "L": (0, 1), "O": (0, -1)}

def simular(mapa, inicio, movimentos):

  solution: `PASSO = {"N": (-1, 0), "S": (1, 0), "L": (0, 1), "O": (0, -1)}
CORRENTE = {">": "L", "<": "O", "^": "N", "v": "S"}

def simular(mapa, inicio, movimentos):
    l, c = inicio
    for m in movimentos:
        dl, dc = PASSO[m]
        if mapa[l + dl][c + dc] != "#":
            l, c = l + dl, c + dc
            if mapa[l][c] in CORRENTE:
                dl, dc = PASSO[CORRENTE[mapa[l][c]]]
                if mapa[l + dl][c + dc] != "#":
                    l, c = l + dl, c + dc
    return (l, c)
`,
  hint: `Para cada movimento: calcule a casa vizinha com PASSO. Se não for "#", mude (l, c). Depois veja se a nova casa é uma corrente (está em CORRENTE): se for, calcule mais um passo na direção dela e, se não for rocha, mude de novo.`,

{ id: "b1", zona: 1, titulo: "Inventário do talude",
  intro: `<p>O ARGO voltou com uma lista de registros: cada um é uma tupla <code>(tipo, valor)</code>. A equipe quer um resumo por tipo.</p>
  <pre>registros = [("moeda", 10), ("ânfora", 120), ("moeda", 15)]
resumo(registros)
# {"moeda": {"quantidade": 2, "valor": 25},
#  "ânfora": {"quantidade": 1, "valor": 120}}</pre>
  <p>É um <b>dicionário de dicionários</b>. Lembre: <code>if chave not in d:</code> verifica se a chave já existe, e <code>d[chave]["valor"] += x</code> altera o dicionário de dentro.</p>`,
  task: `Escreva <code>resumo(registros)</code> que devolve o dicionário com <code>"quantidade"</code> e <code>"valor"</code> (soma) para cada tipo. Lista vazia devolve <code>{}</code>.`,
  starter: `def resumo(registros):
    tabela = {}
    for tipo, valor in registros:
        pass  # atualize tabela[tipo]
    return tabela
`,
  solution: `def resumo(registros):
    tabela = {}
    for tipo, valor in registros:
        if tipo not in tabela:
            tabela[tipo] = {"quantidade": 0, "valor": 0}
        tabela[tipo]["quantidade"] += 1
        tabela[tipo]["valor"] += valor
    return tabela
`,
  hint: `Quando o tipo aparece pela primeira vez, crie tabela[tipo] = {"quantidade": 0, "valor": 0}. Depois, sempre, some 1 na quantidade e o valor no "valor".`,
  casos: [
    { regs: [["moeda", 10], ["ânfora", 120], ["moeda", 15], ["colar", 80], ["moeda", 5]] },
    { regs: [] },
    { regs: [["estátua", 300]] },
    { regs: [["pérola", 40], ["pérola", 45], ["anel", 20], ["pérola", 50], ["anel", 25], ["sino", 60]] },
  ].map(c => Object.assign(c, { mostra: `resumo(${pyfmt(c.regs.map(r => ({ __tuple: r })))})` })),
  rodar(ctl, sim, caso){
    ctl.exige("resumo", "funcao");
    const r = ctl.funcao("resumo", [listaTuplas(caso.regs)]); const v = toJS(r);
    const ord = []; const m = {};
    for (const [t, x] of caso.regs){ if (!m[t]){ m[t] = [0, 0]; ord.push(t); } m[t][0]++; m[t][1] += x; }
    const esperado = { __dict: ord.map(t => [t, { __dict: [["quantidade", m[t][0]], ["valor", m[t][1]]] }]) };
    if (!v || !v.__dict) return { ok: false, msg: `resumo precisa devolver um dicionário, mas devolveu ${curto(ctl.repr(r))}.` };
    if (!igual(v, esperado)) return { ok: false, msg: `Resultado: ${curto(ctl.repr(r), 260)}. Esperado: ${curto(pyfmt(esperado), 260)}.` };

  <p>Cuidado: uma mesma varredura pode repetir a posição, e isso não conta como confirmação. Conjuntos (<code>set</code>) resolvem isso:</p>
  <pre>set([(1, 2), (1, 2), (3, 4)])   # {(1, 2), (3, 4)}

  task: `Escreva <code>confirmados(varreduras)</code> que devolve um <b>conjunto</b> com as posições presentes em 2 ou mais varreduras diferentes. As posições que você devolver aparecem marcadas no mapa.`,
  starter: `def confirmados(varreduras):
    contagem = {}
    # conte em quantas varreduras diferentes cada posição aparece
    return set()
`,
  solution: `def confirmados(varreduras):
    contagem = {}
    for varredura in varreduras:
        for pos in set(varredura):
            contagem[pos] = contagem.get(pos, 0) + 1
    return {pos for pos, n in contagem.items() if n >= 2}

    const marcar = v.__set.filter(p => Array.isArray(p) && p.length === 2).map(([l, c]) => [c, l]);

{ id: "c1", zona: 2, titulo: "A classe Tesouro",
  intro: `<p>Chegamos ao naufrágio do <i>Aurora</i>. Cada peça encontrada vai virar um objeto da classe <code>Tesouro</code>, com <code>nome</code>, <code>valor</code> (em moedas) e <code>peso</code> (em kg).</p>
  <p>Três recursos de classe aparecem aqui:</p>
  <pre>@property              # método lido como atributo: t.densidade
def densidade(self): ...

def __str__(self):     # o que print(t) e str(t) mostram
def __lt__(self, outro):  # define t1 &lt; t2, e com isso sorted() funciona</pre>`,

`,
  solution: TESOURO_PY,

{ id: "c2", zona: 2, titulo: "Porão com limite",
  intro: `<p>O porão do ARGO aguenta um peso máximo. Se uma peça não couber, o porão precisa <b>recusar</b> e avisar com uma exceção própria, que diz quanto passou do limite.</p>
  <pre>class CargaExcedida(Exception):
    def __init__(self, excesso):
        super().__init__(f"Excesso de {excesso} kg")
        self.excesso = excesso

raise CargaExcedida(3)</pre>
  <p>A classe <code>Tesouro</code> da missão anterior já vem pronta (veja a referência). O <code>__len__</code> faz <code>len(porao)</code> funcionar.</p>`,
  task: `Crie <code>CargaExcedida</code> (como acima) e a classe <code>Porao(capacidade)</code> com: <code>adicionar(tesouro)</code>, que guarda a peça ou lança <code>CargaExcedida(excesso)</code> sem guardar; <code>peso_total()</code>; e <code>__len__</code> (quantas peças há).`,
  preludio: TESOURO_PY,
  starter: `class CargaExcedida(Exception):
    def __init__(self, excesso):
        super().__init__(f"Excesso de {excesso} kg")
        self.excesso = excesso


class Porao:
    def __init__(self, capacidade):
        self.capacidade = capacidade
        self.itens = []
`,
  solution: `class CargaExcedida(Exception):
    def __init__(self, excesso):
        super().__init__(f"Excesso de {excesso} kg")
        self.excesso = excesso


class Porao:
    def __init__(self, capacidade):
        self.capacidade = capacidade
        self.itens = []

    def peso_total(self):
        return sum(t.peso for t in self.itens)

    def adicionar(self, tesouro):
        excesso = self.peso_total() + tesouro.peso - self.capacidade
        if excesso > 0:
            raise CargaExcedida(excesso)
        self.itens.append(tesouro)

    def __len__(self):
        return len(self.itens)
`,
  hint: `Em adicionar, calcule excesso = peso atual + peso da peça - capacidade. Se for maior que zero, raise CargaExcedida(excesso) ANTES do append. Senão, faça o append. Exatamente no limite (excesso 0) cabe.`,
  casos: [
    { cap: 20, itens: [["Ânfora", 120, 8], ["Colar", 90, 2], ["Canhão", 200, 50], ["Sino", 60, 10], ["Moeda", 30, 1], ["Taça", 40, 1]] },
    { cap: 12, itens: [["Baú", 150, 13], ["Coroa", 300, 3], ["Espelho", 45, 5], ["Bússola", 20, 2], ["Prato", 15, 3], ["Anel", 25, 2]] },
  ].map(c => Object.assign(c, { mostra: `porao = Porao(${c.cap})<br>` + c.itens.map(([n, v, p]) => `porao.adicionar(Tesouro(${pyfmt(n)}, ${v}, ${p}))`).join("<br>") })),
  rodar(ctl, sim, caso){
    ctl.exige("CargaExcedida", "classe"); ctl.exige("Porao", "classe");
    if (!Sk.misceval.isTrue(Sk.builtin.issubclass(ctl.global("CargaExcedida"), Sk.builtin.Exception))) return { ok: false, msg: `CargaExcedida precisa herdar de Exception: class CargaExcedida(Exception):` };
    const porao = ctl.criar("Porao", [py(caso.cap)]);
    let total = 0, n = 0; const log = [];
    for (const [nome, v, p] of caso.itens){
      const t = ctl.criar("Tesouro", [py(nome), py(v), py(p)]);
      const ex = ctl.excecao(() => ctl.metodo(porao, "adicionar", [t]));
      const exc = total + p - caso.cap;
      if (exc > 0){
        if (!ex) return { ok: false, msg: `${nome} (${p} kg) não cabe: o porão tinha ${total} de ${caso.cap} kg. adicionar devia lançar CargaExcedida(${exc}).` };
        if (!ex.eh("CargaExcedida")) return { ok: false, msg: `Ao recusar ${nome}, a exceção lançada foi ${ex.texto}, e não CargaExcedida.` };
        const e = toJS(ctl.attr(ex.obj, "excesso"));
        if (e !== exc) return { ok: false, msg: `O excesso ao tentar ${nome} é ${exc} kg, mas a exceção trouxe excesso = ${pyfmt(e)}.` };
        const s = toJS(ctl.builtin("str", [ex.obj]));
        if (s !== `Excesso de ${exc} kg`) return { ok: false, msg: `str(erro) deveria ser 'Excesso de ${exc} kg', mas veio ${pyfmt(s)}.` };
        log.push(`✗ ${nome}: excesso de ${exc} kg`);
      } else {
        if (ex) return { ok: false, msg: `${nome} (${p} kg) cabe no porão (${total} de ${caso.cap} kg), mas adicionar lançou ${ex.texto}.` };
        total += p; n++; log.push(`✓ ${nome}`);
      }
      const pt = toJS(ctl.metodo(porao, "peso_total", []));
      if (pt !== total) return { ok: false, msg: `Depois de tentar ${nome}, peso_total() devia ser ${total}, mas veio ${pyfmt(pt)}.` };
      const ln = toJS(ctl.builtin("len", [porao]));
      if (ln !== n) return { ok: false, msg: `Depois de tentar ${nome}, len(porao) devia ser ${n}, mas veio ${pyfmt(ln)}.` };
    }
    return { ok: true, nota: log.join(" · ") };
  } },

  <p>A estação vai testar a sua função com equipamentos que você nunca viu (outras subclasses), então ela precisa só chamar <code>energia</code>.</p>`,
  task: `Crie <code>Equipamento(nome, consumo)</code> cujo <code>energia(minutos)</code> lança <code>NotImplementedError</code>; <code>Lanterna</code>, que gasta <code>consumo × minutos</code>; <code>Propulsor(nome, consumo, potencia)</code>, que gasta <code>consumo × minutos × potencia</code>; e a função <code>bateria_necessaria(equipamentos, minutos)</code> com a soma.`,
  posludio: `try:

except NameError:

`,
  forbid: [{ re: /isinstance|type\s*\(/, msg: "Não use isinstance nem type(): deixe cada classe calcular a própria energia (polimorfismo)." }],
  starter: `class Equipamento:
    def __init__(self, nome, consumo):
        self.nome = nome
        self.consumo = consumo

    def energia(self, minutos):
        raise NotImplementedError("cada equipamento calcula a sua energia")


def bateria_necessaria(equipamentos, minutos):

`,
  solution: `class Equipamento:
    def __init__(self, nome, consumo):
        self.nome = nome
        self.consumo = consumo

    def energia(self, minutos):
        raise NotImplementedError("cada equipamento calcula a sua energia")


class Lanterna(Equipamento):
    def energia(self, minutos):
        return self.consumo * minutos


class Propulsor(Equipamento):
    def __init__(self, nome, consumo, potencia):
        super().__init__(nome, consumo)
        self.potencia = potencia

    def energia(self, minutos):
        return self.consumo * minutos * self.potencia


def bateria_necessaria(equipamentos, minutos):
    return sum(e.energia(minutos) for e in equipamentos)
`,
  hint: `Lanterna só precisa sobrescrever energia. Propulsor precisa de um __init__ com potencia que chama super().__init__(nome, consumo). Em bateria_necessaria, some e.energia(minutos) de cada equipamento, sem perguntar o tipo.`,
  casos: [
    { min: 10, eq: [["Lanterna", "Farol", 2], ["Propulsor", "Hélice", 3, 2], ["Lanterna", "Luz de busca", 5]] },
    { min: 7, eq: [["Propulsor", "Turbina", 4, 3], ["Camera", "Câmera", 0], ["Lanterna", "Farolete", 1]] },
  ].map(c => Object.assign(c, { mostra: `bateria_necessaria([${c.eq.map(e => e[0] === "Camera" ? "_Camera(\"Câmera\", 0)" : `${e[0]}(${e.slice(1).map(pyfmt).join(", ")})`).join(", ")}], ${c.min})` })),
  rodar(ctl, sim, caso){
    for (const n of ["Equipamento", "Lanterna", "Propulsor"]) ctl.exige(n, "classe");
    ctl.exige("bateria_necessaria", "funcao");
    for (const n of ["Lanterna", "Propulsor"]) if (!ctl.subclasse(n, "Equipamento")) return { ok: false, msg: `${n} precisa herdar de Equipamento: class ${n}(Equipamento):` };
    const base = ctl.criar("Equipamento", [py("genérico"), py(1)]);
    const ex = ctl.excecao(() => ctl.metodo(base, "energia", [py(5)]));
    if (!ex || ex.cls !== "NotImplementedError") return { ok: false, msg: `Equipamento.energia deve lançar NotImplementedError (a classe base não sabe calcular), mas ${ex ? "lançou " + ex.texto : "não lançou nada"}.` };
    let total = 0; const objs = [];
    for (const e of caso.eq){
      const [cls, nome, cons, pot] = e;
      const o = cls === "Camera" ? ctl.criar("_Camera", [py(nome), py(cons)]) : ctl.criar(cls, e.slice(1).map(py));
      const esperado = cls === "Lanterna" ? cons * caso.min : cls === "Propulsor" ? cons * caso.min * pot : 7 * caso.min;
      if (cls !== "Camera"){ const en = toJS(ctl.metodo(o, "energia", [py(caso.min)])); if (en !== esperado) return { ok: false, msg: `${cls}(${e.slice(1).map(pyfmt).join(", ")}).energia(${caso.min}) deveria ser ${esperado}, mas deu ${pyfmt(en)}.` }; }
      total += esperado; objs.push(o);
    }
    const r = toJS(ctl.funcao("bateria_necessaria", [ctl.lista(objs), py(caso.min)]));
    if (r !== total) return { ok: false, msg: `bateria_necessaria deveria dar ${total}, mas deu ${pyfmt(r)}.${caso.eq.some(e => e[0] === "Camera") ? " Este teste inclui uma _Camera, subclasse que a estação criou." : ""}` };
    return { ok: true, nota: `Energia necessária: ${total}` };

{ id: "d1", zona: 3, titulo: "Fôlego",
  intro: `<p>Agora o ARGO navega sozinho por túneis estreitos. A cada turno a estação chama <code>agir(self, sonar)</code> no seu piloto, e você devolve uma ação: <code>"N"</code>, <code>"S"</code>, <code>"L"</code>, <code>"O"</code>, <code>"R"</code> (respirar) ou <code>"P"</code> (parar um turno).</p>
  <p>Cada movimento gasta 1 de oxigênio. Sobre uma <b>bolha de ar</b>, <code>"R"</code> enche o tanque de novo. Os túneis mudam a cada mergulho, mas sempre começam para leste e nunca se dividem.</p>
  <p>Como o piloto é um objeto, ele <b>lembra</b> coisas entre um turno e outro: guarde em <code>self.ultimo</code> a última direção para não voltar pelo mesmo caminho.</p>`,

class Piloto:

        return "L"
`,
  solution: `OPOSTO = {"N": "S", "S": "N", "L": "O", "O": "L"}

class Piloto:
    def __init__(self):
        self.ultimo = "L"

    def agir(self, sonar):
        if sonar.na_bolha() and sonar.oxigenio() < sonar.oxigenio_maximo():
            return "R"
        for d in [self.ultimo, "N", "L", "S", "O"]:

  hint: `Primeiro: se está na bolha e o oxigênio está abaixo do máximo, devolva "R". Depois tente as direções começando por self.ultimo, pulando OPOSTO[self.ultimo] (voltar). Na primeira livre, guarde em self.ultimo e devolva.`,

OPOSTO = {"N": "S", "S": "N", "L": "O", "O": "L"}

  solution: `PASSO = {"N": (-1, 0), "S": (1, 0), "L": (0, 1), "O": (0, -1)}
OPOSTO = {"N": "S", "S": "N", "L": "O", "O": "L"}

class Piloto:

{ id: "d3", zona: 3, titulo: "Ordens com ruído",
  intro: `<p>O cabo acústico ficou ruidoso. As ordens agora chegam no formato <code>"L:3, S:2"</code> (direção, dois-pontos, quantidade, separados por vírgula), e algumas chegam corrompidas.</p>

int("dois")                 # ValueError!
try:
    ...
except OrdemInvalida as e:
    erros.append(str(e))
else:                       # só roda se NÃO houve exceção
    ...</pre>`,
  task: `Crie <code>OrdemInvalida(Exception)</code> e <code>interpretar(ordem)</code>, que devolve a lista de movimentos ou lança <code>OrdemInvalida("Direção inválida: X")</code> / <code>OrdemInvalida("Quantidade inválida: Q")</code> (quantidade que não é inteiro ou é ≤ 0). Depois, <code>processar(ordens)</code> devolve a tupla <code>(movimentos, erros)</code>: todos os movimentos das ordens válidas e a lista de mensagens das inválidas.`,
  starter: `class OrdemInvalida(Exception):
    pass


def interpretar(ordem):
    movimentos = []
    for parte in ordem.split(","):
        direcao, _, quantidade = parte.strip().partition(":")
        # valide e acrescente os movimentos
    return movimentos


def processar(ordens):

    return movimentos, erros
`,
  solution: `class OrdemInvalida(Exception):
    pass


def interpretar(ordem):
    movimentos = []
    for parte in ordem.split(","):
        direcao, _, quantidade = parte.strip().partition(":")
        if direcao not in ("N", "S", "L", "O"):
            raise OrdemInvalida(f"Direção inválida: {direcao}")
        try:
            vezes = int(quantidade)
        except ValueError:
            raise OrdemInvalida(f"Quantidade inválida: {quantidade}")
        if vezes <= 0:
            raise OrdemInvalida(f"Quantidade inválida: {quantidade}")
        movimentos += [direcao] * vezes
    return movimentos


def processar(ordens):
    movimentos, erros = [], []
    for ordem in ordens:
        try:
            novos = interpretar(ordem)
        except OrdemInvalida as e:
            erros.append(str(e))
        else:
            movimentos += novos
    return movimentos, erros
`,
  hint: `Em interpretar: se a direção não for N, S, L ou O, raise OrdemInvalida(f"Direção inválida: {direcao}"). Converta a quantidade dentro de try/except ValueError e, no except, lance OrdemInvalida(f"Quantidade inválida: {quantidade}"); faça o mesmo se for ≤ 0. Em processar, chame interpretar dentro de try; no except guarde str(e); no else some os movimentos.`,
  casos: M12_CASOS.map(c => {
    const movs = [], erros = [];
    for (const o of c.ordens){ const r = interpretarJS(o); if (r.erro) erros.push(r.erro); else movs.push(...r.movs); }
    return { ordens: c.ordens, movs, erros, map: rotaMapa(movs, c.marcas), nota: `Ordens: ${pyfmt(c.ordens)}` };
  }),
  rodar(ctl, sim, caso){
    ctl.exige("OrdemInvalida", "classe"); ctl.exige("interpretar", "funcao"); ctl.exige("processar", "funcao");
    if (!Sk.misceval.isTrue(Sk.builtin.issubclass(ctl.global("OrdemInvalida"), Sk.builtin.Exception))) return { ok: false, msg: "OrdemInvalida precisa herdar de Exception." };
    for (const o of caso.ordens){
      const esp = interpretarJS(o);
      if (!esp.erro) continue;
      const ex = ctl.excecao(() => ctl.funcao("interpretar", [py(o)]));
      if (!ex) return { ok: false, msg: `interpretar(${pyfmt(o)}) deveria lançar OrdemInvalida("${esp.erro}"), mas não lançou nada.` };
      if (!ex.eh("OrdemInvalida")) return { ok: false, msg: `interpretar(${pyfmt(o)}) lançou ${ex.texto}. Deveria ser OrdemInvalida("${esp.erro}").` };
      const s = toJS(ctl.builtin("str", [ex.obj]));
      if (s !== esp.erro) return { ok: false, msg: `A mensagem de interpretar(${pyfmt(o)}) deveria ser ${pyfmt(esp.erro)}, mas veio ${pyfmt(s)}.` };
    }
    const r = ctl.funcao("processar", [listaStr(caso.ordens)]); const v = toJS(r);
    if (!Array.isArray(v) || v.length !== 2) return { ok: false, msg: `processar precisa devolver a tupla (movimentos, erros), mas devolveu ${curto(ctl.repr(r))}.` };
    const [movs, erros] = v;
    if (!igual(erros, caso.erros)) return { ok: false, msg: `Erros registrados: ${curto(pyfmt(erros), 240)}. Esperado: ${pyfmt(caso.erros)}.` };
    if (!igual(movs, caso.movs)){ mostrarRota(sim, Array.isArray(movs) ? movs : []); return { ok: false, msg: `Movimentos: ${curto(pyfmt(movs))}. Esperado: ${curto(pyfmt(caso.movs))}.` }; }
    const res = executarRota(sim, movs); if (res.ok) res.nota = `${caso.erros.length} ordem(ns) descartada(s): ${caso.erros.join(" · ")}`; return res;
  } },

{ id: "e1", zona: 4, titulo: "Câmaras submersas",
  intro: `<p>As cavernas abissais são cheias de câmaras isoladas por rocha. Uma <b>câmara</b> é um grupo de casas de água ligadas entre si (norte, sul, leste, oeste). A equipe quer saber quantas existem.</p>
  <p>A técnica clássica é a <b>inundação recursiva</b>: ao achar uma casa de água, "inunde" ela (marque como visitada) e chame a mesma função para os quatro vizinhos. Quando a recursão termina, a câmara inteira foi marcada.</p>
  <pre>grade = [list(linha) for linha in mapa]   # cópia que dá para alterar

def inundar(l, c):
    if grade[l][c] == "#":    # caso base: rocha ou já inundada
        return
    grade[l][c] = "#"
    ...                       # chame inundar nos vizinhos</pre>`,
  task: `Escreva <code>contar_camaras(mapa)</code> que devolve o número de câmaras. Use uma função <b>recursiva</b>.`,

  analise: true,
  starter: `def contar_camaras(mapa):
    grade = [list(linha) for linha in mapa]

    def inundar(l, c):
        pass

    total = 0
    return total
`,
  solution: `def contar_camaras(mapa):
    grade = [list(linha) for linha in mapa]

    def inundar(l, c):
        if grade[l][c] == "#":
            return
        grade[l][c] = "#"
        for dl, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
            inundar(l + dl, c + dc)

    total = 0
    for l in range(len(grade)):
        for c in range(len(grade[l])):
            if grade[l][c] != "#":
                inundar(l, c)
                total += 1
    return total
`,

{ id: "e2", zona: 4, titulo: "Varredura em espiral",
  intro: `<p>No salão principal do <i>Aurora</i>, o ARGO precisa varrer cada casa em <b>espiral</b>: começa no canto de cima à esquerda, vai para a direita, desce, volta pela base, sobe, e vai fechando para dentro.</p>
  <p>Em vez de montar uma lista enorme, escreva um <b>gerador</b>: uma função com <code>yield</code> que entrega uma posição de cada vez, só quando pedem.</p>
  <pre>def contagem(n):
    for i in range(n):
        yield i          # pausa aqui e entrega i

for x in contagem(3):    # 0, 1, 2
    ...</pre>
  <p>As posições são relativas ao salão: <code>(0, 0)</code> é o canto de cima à esquerda e o salão tem <code>altura</code> linhas e <code>largura</code> colunas.</p>`,
  task: `Escreva o gerador <code>espiral(altura, largura)</code> que entrega as tuplas <code>(linha, coluna)</code> na ordem da espiral, passando por todas as casas exatamente uma vez. O ARGO seguirá as posições geradas.`,
  require: [{ re: /\byield\b/, msg: "espiral precisa ser um gerador: use yield para entregar cada posição." }],
  starter: `def espiral(altura, largura):
    topo, base = 0, altura - 1
    esq, dir = 0, largura - 1
    while topo <= base and esq <= dir:
        # entregue a borda de cima, a direita, a de baixo e a esquerda
        # depois feche um anel para dentro
        break
`,
  solution: `def espiral(altura, largura):
    topo, base = 0, altura - 1
    esq, dir = 0, largura - 1
    while topo <= base and esq <= dir:
        for c in range(esq, dir + 1):
            yield (topo, c)
        for l in range(topo + 1, base + 1):
            yield (l, dir)
        if topo < base:
            for c in range(dir - 1, esq - 1, -1):
                yield (base, c)
        if esq < dir:
            for l in range(base - 1, topo, -1):
                yield (l, esq)
        topo, base, esq, dir = topo + 1, base - 1, esq + 1, dir - 1
`,
  hint: `Quatro laços por anel: borda de cima (esquerda → direita), lado direito (descendo), borda de baixo (direita → esquerda, só se topo < base) e lado esquerdo (subindo, só se esq < dir). No fim do anel, aperte: topo+1, base-1, esq+1, dir-1. Os "só se" evitam repetir casas quando sobra uma linha ou coluna.`,
  casos: M14_TAM.map(([h, w], i) => ({ h, w, map: salaEspiral(h, w, 30 + i), nota: `espiral(${h}, ${w})` })),
  rodar(ctl, sim, caso){
    ctl.exige("espiral", "funcao");
    const r = ctl.funcao("espiral", [py(caso.h), py(caso.w)]);
    if (tipoPy(ctl, r) !== "generator") return { ok: false, msg: `espiral precisa ser um gerador (com yield), mas devolveu ${curto(ctl.repr(r))}.` };
    const v = iterar(ctl, r, caso.h * caso.w);
    const esp = espiralJS(caso.h, caso.w);
    const movs = [];
    for (let k = 0; k < v.length; k++){
      const p = v[k];
      if (!Array.isArray(p) || p.length !== 2) return { ok: false, msg: `O gerador entregou ${pyfmt(p)}; cada item deve ser uma tupla (linha, coluna).` };
      if (k >= esp.length) { mostrarRota(sim, movs); return { ok: false, msg: `O gerador entregou mais de ${esp.length} posições: o salão tem só ${caso.h} × ${caso.w} casas.` }; }
      if (!igual(p, esp[k])){ mostrarRota(sim, movs); return { ok: false, msg: `A posição nº ${k + 1} deveria ser ${pyfmt({ __tuple: esp[k] })}, mas veio ${pyfmt({ __tuple: p })}.`, destaque: [[p[1] + 1, p[0] + 1]] }; }
      if (k > 0){ const [a, b] = v[k - 1]; movs.push(p[0] > a ? "S" : p[0] < a ? "N" : p[1] > b ? "L" : "O"); }
    }
    if (v.length < esp.length){ mostrarRota(sim, movs); return { ok: false, msg: `O gerador parou depois de ${v.length} posições, mas o salão tem ${esp.length} casas.` }; }
    const res = executarRota(sim, movs); if (res.ok) res.nota = `espiral(${caso.h}, ${caso.w}): ${esp.length} posições`; return res;
  } },

{ id: "e3", zona: 4, titulo: "Rotas possíveis",
  intro: `<p>Para planejar mergulhos de reserva, a equipe quer saber <b>quantas rotas diferentes</b> levam do ponto de partida até a base, sem passar duas vezes pela mesma casa.</p>
  <p>Isso pede <b>backtracking</b>: explore um caminho, e ao voltar da recursão <b>desfaça</b> a marcação para que outros caminhos possam usar aquela casa.</p>

total = ...            # explore os 4 vizinhos
visitados.remove((l, c))   # desfaz: libera a casa para outras rotas</pre>`,

  require: [{ test: usaRecursao, msg: "Esta missão é sobre backtracking: use uma função recursiva." }],
  analise: true,
  starter: `def contar_rotas(mapa, inicio, fim):
    visitados = set()

    def explorar(l, c):
        return 0

    return explorar(inicio[0], inicio[1])
`,
  solution: `def contar_rotas(mapa, inicio, fim):
    visitados = set()

    def explorar(l, c):
        if mapa[l][c] == "#" or (l, c) in visitados:
            return 0
        if (l, c) == fim:
            return 1
        visitados.add((l, c))
        total = 0
        for dl, dc in ((1, 0), (-1, 0), (0, 1), (0, -1)):
            total += explorar(l + dl, c + dc)
        visitados.remove((l, c))
        return total

    return explorar(inicio[0], inicio[1])
`,
  hint: `Casos base: rocha ou casa já visitada → 0 rotas; chegou no fim → 1 rota. Senão: marque a casa, some explorar() dos 4 vizinhos, desmarque (visitados.remove) e devolva a soma.`,
  casos: M15_MAPAS.map(rows => { const map = mapaDe(rows); const fy = rows.findIndex(r => r.includes("@")); return { map, fim: [rows[fy].indexOf("@"), fy] }; }),
  rodar(ctl, sim, caso){
    ctl.exige("contar_rotas", "funcao");
    const [sx, sy] = caso.map.start, [fx, fy] = caso.fim;
    const r = toJS(ctl.funcao("contar_rotas", [listaStr(caso.map.grid), tup([sy, sx]), tup([fy, fx])]));
    const n = contarRotasJS(caso.map.grid, caso.map.start, caso.fim);
    if (r !== n) return { ok: false, msg: `contar_rotas devolveu ${pyfmt(r)}, mas existem ${n} rotas neste mapa.`, destaque: [[sx, sy], [fx, fy]] };
    return { ok: true, nota: `${n} rotas diferentes.`, destaque: [[sx, sy], [fx, fy]] };
  } },

{ id: "f1", zona: 5, titulo: "Atalho pelas correntes",
  intro: `<p>Na fossa, as correntes podem ajudar ou atrapalhar. A equipe quer a rota com o <b>menor número de comandos</b> até a base, aproveitando os empurrões (as mesmas regras do simulador da Zona 1, mas aqui bater na rocha é proibido).</p>
  <p>O algoritmo certo é a <b>busca em largura</b> (BFS): explore primeiro tudo que fica a 1 comando, depois a 2, e assim por diante. A primeira vez que chegar na base, é o menor caminho. Uma <code>deque</code> faz de fila eficiente:</p>
  <pre>from collections import deque
fila = deque([(inicio, [])])   # (posição, rota até ela)
pos, rota = fila.popleft()
fila.append((nova, rota + [d]))</pre>`,
  task: `Escreva <code>menor_rota(mapa, inicio, fim)</code> que devolve a lista de comandos mais curta de <code>inicio</code> até <code>fim</code> (tuplas <code>(linha, coluna)</code>). O ARGO vai executar a sua rota.`,
  starter: `from collections import deque

PASSO = {"N": (-1, 0), "S": (1, 0), "L": (0, 1), "O": (0, -1)}
CORRENTE = {">": "L", "<": "O", "^": "N", "v": "S"}

def andar(mapa, l, c, d):
    # devolve a posição depois do comando d (com corrente), ou None se for rocha
    return None

def menor_rota(mapa, inicio, fim):
    return []
`,
  solution: `from collections import deque

PASSO = {"N": (-1, 0), "S": (1, 0), "L": (0, 1), "O": (0, -1)}
CORRENTE = {">": "L", "<": "O", "^": "N", "v": "S"}

def andar(mapa, l, c, d):
    dl, dc = PASSO[d]
    if mapa[l + dl][c + dc] == "#":
        return None
    l, c = l + dl, c + dc
    if mapa[l][c] in CORRENTE:
        dl, dc = PASSO[CORRENTE[mapa[l][c]]]
        if mapa[l + dl][c + dc] != "#":
            l, c = l + dl, c + dc
    return (l, c)

def menor_rota(mapa, inicio, fim):
    fila = deque([(inicio, [])])
    vistos = {inicio}
    while fila:
        pos, rota = fila.popleft()
        if pos == fim:
            return rota
        for d in PASSO:
            nova = andar(mapa, pos[0], pos[1], d)
            if nova and nova not in vistos:
                vistos.add(nova)
                fila.append((nova, rota + [d]))
    return []
`,
  hint: `Comece com fila = deque([(inicio, [])]) e vistos = {inicio}. Enquanto houver fila: tire o primeiro (popleft). Se for o fim, devolva a rota. Senão, para cada direção, calcule a nova posição com andar; se não for None e não estiver em vistos, marque e ponha na fila com rota + [d].`,
  casos: M16_MAPAS.map(m => ({ map: m })),
  rodar(ctl, sim, caso){
    ctl.exige("menor_rota", "funcao");
    const [sx, sy] = caso.map.start; const fy = caso.map.grid.findIndex(r => r.includes("@")), fx = caso.map.grid[fy].indexOf("@");
    const r = ctl.funcao("menor_rota", [listaStr(caso.map.grid), tup([sy, sx]), tup([fy, fx])]); const v = toJS(r);
    if (!Array.isArray(v)) return { ok: false, msg: `menor_rota precisa devolver uma lista de comandos, mas devolveu ${curto(ctl.repr(r))}.` };
    const res = executarRota(sim, v); if (!res.ok) return res;
    const best = menorRota(caso.map.grid, sx, sy, fx, fy);
    if (v.length > best) return { ok: false, msg: `A rota chegou em ${v.length} comandos, mas dá para chegar em ${best}. Use busca em largura para garantir o menor caminho.` };
    return { ok: true, nota: `Rota ótima: ${v.length} comandos (${compactarJS(v)})` };
  } },

{ id: "f2", zona: 5, titulo: "A melhor carga",
  intro: `<p>O porão aguenta pouco peso e há tesouros demais. Qual combinação vale mais sem passar do limite? Testar todas as combinações dá certo com 6 peças, mas com 22 são mais de 4 milhões, e o computador do ARGO não aguenta.</p>
  <p><b>Programação dinâmica</b> resolve: <code>melhor[cap]</code> guarda a melhor carga possível para cada capacidade de 0 até o limite. Cada tesouro novo tenta melhorar essas respostas, percorrendo as capacidades <b>de trás para frente</b> (assim cada peça é usada uma vez só).</p>
  <pre>melhor = [(0, [])] * (capacidade + 1)   # (valor, nomes)
for cap in range(capacidade, t.peso - 1, -1):
    valor, nomes = melhor[cap - t.peso]
    ...</pre>
  <p>A classe <code>Tesouro</code> já vem pronta (veja a referência).</p>`,
  task: `Escreva <code>melhor_carga(tesouros, capacidade)</code> que devolve a <b>lista de nomes</b> da combinação de maior valor total com peso total ≤ capacidade.`,
  preludio: TESOURO_PY,
  starter: `def melhor_carga(tesouros, capacidade):
    melhor = [(0, [])] * (capacidade + 1)
    for t in tesouros:
        pass
    return melhor[capacidade][1]
`,
  solution: `def melhor_carga(tesouros, capacidade):
    melhor = [(0, [])] * (capacidade + 1)
    for t in tesouros:
        for cap in range(capacidade, t.peso - 1, -1):
            valor, nomes = melhor[cap - t.peso]
            if valor + t.valor > melhor[cap][0]:
                melhor[cap] = (valor + t.valor, nomes + [t.nome])
    return melhor[capacidade][1]
`,
  hint: `Para cada tesouro t e cada cap de capacidade até t.peso (descendo): a opção "levar t" vale melhor[cap - t.peso][0] + t.valor. Se isso for maior que melhor[cap][0], troque melhor[cap] por (esse valor, nomes + [t.nome]). Use nomes + [...] (lista nova), não append, para não mexer nas outras respostas.`,
  casos: M17_CASOS.map(c => Object.assign(c, { mostra: `melhor_carga([${c.itens.length} tesouros], ${c.cap})<br>` + c.itens.map(([n, v, p]) => `${n}: ${v} moedas, ${p} kg`).join(" · ") })),
  rodar(ctl, sim, caso){
    ctl.exige("melhor_carga", "funcao");
    const objs = caso.itens.map(([n, v, p]) => ctl.criar("Tesouro", [py(n), py(v), py(p)]));
    const r = ctl.funcao("melhor_carga", [ctl.lista(objs), py(caso.cap)]); const v = toJS(r);
    if (!Array.isArray(v) || !v.every(x => typeof x === "string")) return { ok: false, msg: `melhor_carga precisa devolver uma lista de nomes, mas devolveu ${curto(ctl.repr(r))}.` };
    if (new Set(v).size !== v.length) return { ok: false, msg: `A carga repete peças: ${curto(pyfmt(v))}. Cada tesouro só existe uma vez.` };
    const mapa = Object.fromEntries(caso.itens.map(i => [i[0], i]));
    const desconhecido = v.find(n => !mapa[n]); if (desconhecido) return { ok: false, msg: `Não existe tesouro chamado ${pyfmt(desconhecido)}.` };
    const peso = v.reduce((a, n) => a + mapa[n][2], 0), valor = v.reduce((a, n) => a + mapa[n][1], 0);
    if (peso > caso.cap) return { ok: false, msg: `Essa carga pesa ${peso} kg e passa do limite de ${caso.cap} kg.` };
    const best = mochilaJS(caso.itens, caso.cap);
    if (valor < best) return { ok: false, msg: `Sua carga vale ${valor} moedas, mas dá para levar ${best} moedas com ${caso.cap} kg.` };
    return { ok: true, nota: `${v.length} peças, ${peso} kg, ${valor} moedas: ${v.join(", ")}` };
  } },

{ id: "f3", zona: 5, titulo: "Expedição final",
  intro: `<p>O fundo da fossa guarda a câmara selada do <i>Aurora</i>. Portas (<code>A</code>, <code>B</code>, <code>C</code>) só abrem para quem já pegou a chave de mesma letra (<code>a</code>, <code>b</code>, <code>c</code>), e as correntes continuam empurrando. Uma porta fechada também bloqueia o empurrão da corrente.</p>
  <p>O truque: o <b>estado</b> da busca não é só a posição, mas a posição <b>e as chaves que você já tem</b>. A mesma casa com chaves diferentes é outro estado. Um <code>frozenset</code> (conjunto imutável) pode entrar em tuplas e em conjuntos:</p>
  <pre>chaves = frozenset()
chaves | {"a"}                # frozenset({'a'})
vistos = {(inicio, frozenset())}</pre>`,
  task: `Escreva <code>rota_final(mapa, inicio)</code> que devolve a lista de comandos mais curta de <code>inicio</code> até a base <code>"@"</code>, pegando as chaves necessárias pelo caminho.`,
  starter: `from collections import deque

PASSO = {"N": (-1, 0), "S": (1, 0), "L": (0, 1), "O": (0, -1)}
CORRENTE = {">": "L", "<": "O", "^": "N", "v": "S"}

def bloqueado(mapa, l, c, chaves):
    casa = mapa[l][c]
    return casa == "#" or (casa in "ABC" and casa.lower() not in chaves)

def rota_final(mapa, inicio):
    return []
`,
  solution: `from collections import deque

PASSO = {"N": (-1, 0), "S": (1, 0), "L": (0, 1), "O": (0, -1)}
CORRENTE = {">": "L", "<": "O", "^": "N", "v": "S"}

def bloqueado(mapa, l, c, chaves):
    casa = mapa[l][c]
    return casa == "#" or (casa in "ABC" and casa.lower() not in chaves)

def andar(mapa, l, c, d, chaves):
    dl, dc = PASSO[d]
    if bloqueado(mapa, l + dl, c + dc, chaves):
        return None
    l, c = l + dl, c + dc
    if mapa[l][c] in CORRENTE:
        dl, dc = PASSO[CORRENTE[mapa[l][c]]]
        if not bloqueado(mapa, l + dl, c + dc, chaves):
            l, c = l + dl, c + dc
    return (l, c)

def rota_final(mapa, inicio):
    fila = deque([(inicio, frozenset(), [])])
    vistos = {(inicio, frozenset())}
    while fila:
        pos, chaves, rota = fila.popleft()
        if mapa[pos[0]][pos[1]] == "@":
            return rota
        for d in PASSO:
            nova = andar(mapa, pos[0], pos[1], d, chaves)
            if nova is None:
                continue
            casa = mapa[nova[0]][nova[1]]
            novas = chaves | {casa} if casa in "abc" else chaves
            if (nova, novas) not in vistos:
                vistos.add((nova, novas))
                fila.append((nova, novas, rota + [d]))
    return []
`,
  hint: `É a BFS da missão "Atalho pelas correntes" com um item a mais no estado. A fila guarda (posição, chaves, rota) e vistos guarda (posição, chaves). Ao andar, use bloqueado com as chaves atuais (também para o empurrão). Se a casa nova for uma chave minúscula, o novo conjunto é chaves | {casa}.`,
  casos: M18_MAPAS.map(rows => ({ map: mapaDe(rows) })),
  rodar(ctl, sim, caso){
    ctl.exige("rota_final", "funcao");
    const [sx, sy] = caso.map.start;
    const r = ctl.funcao("rota_final", [listaStr(caso.map.grid), tup([sy, sx])]); const v = toJS(r);
    if (!Array.isArray(v)) return { ok: false, msg: `rota_final precisa devolver uma lista de comandos, mas devolveu ${curto(ctl.repr(r))}.` };
    const res = executarRota(sim, v); if (!res.ok) return res;
    const best = menorRotaChaves(caso.map.grid, sx, sy);
    if (v.length > best) return { ok: false, msg: `A rota chegou em ${v.length} comandos, mas dá para chegar em ${best}.` };
    return { ok: true, nota: `Rota ótima: ${v.length} comandos, chaves: ${[...sim.chaves].sort().join(", ") || "nenhuma"}` };
  } },
];

<script>

function cellHtml(ch, x, y){

function colorirCamaras(grid){
  const seen = new Set(); let n = 0;

    while (st.length){ const [a, b] = st.pop(); const el = $(`[data-c="${a},${b}"]`); if (el) el.style.background = `hsl(${hue} 55% 30%)`;
      for (const [p, q] of vizinhos4(grid, a, b)) if (grid[q][p] !== "#" && !seen.has(p+","+q)){ seen.add(p+","+q); st.push([p, q]); } }

}
function placeRobot(instant){

function status(){

/* ---------------- execução ---------------- */
function explain(err){
  const line = err.line ? ` (linha ${err.line})` : "";
  if (err.kind === "compile"){
    if (!err.cls) return { msg: err.msg, hint: "A estação procura funções e classes pelo nome exato pedido na tarefa." };
    let hint = "Confira os dois-pontos no fim de def, if, for, while e class, os parênteses e a indentação (4 espaços por nível).";
    if (/Indentation/.test(err.cls)) hint = "A indentação não bate: cada bloco usa 4 espaços a mais que a linha de cima, e linhas do mesmo bloco ficam alinhadas.";
    return { msg: `Erro de sintaxe${line}: ${err.texto}`, hint };
  }
  if (err.kind === "exception"){
    let hint = "Uma exceção escapou do seu código sem ser tratada.";
    if (err.cls === "NameError") hint = "Você usou um nome que não existe (ainda). Confira a grafia e se a variável foi criada antes.";
    else if (err.cls === "IndexError") hint = "Você acessou uma posição fora da lista ou da string. Lembre que o último índice é len(x) - 1.";
    else if (err.cls === "KeyError") hint = "Você leu uma chave que não está no dicionário. Use if chave in d, ou d.get(chave, padrão).";
    else if (err.cls === "TypeError") hint = "Algum valor é de um tipo diferente do esperado (por exemplo, somar texto com número, ou chamar uma função com argumentos a mais ou a menos).";
    else if (err.cls === "AttributeError") hint = "O objeto não tem esse atributo ou método. Confira a grafia e se ele foi criado no __init__ com self.";
    else if (err.cls === "ValueError") hint = "Um valor tem o tipo certo mas o conteúdo errado, como int('dois'). Trate com try/except ValueError.";
    else if (err.cls === "RecursionError") hint = "A recursão não parou. Confira o caso base e se as casas visitadas estão sendo marcadas.";
    else if (err.cls === "ZeroDivisionError") hint = "Houve uma divisão por zero.";
    return { msg: err.texto + line, hint };
  }
  if (err.kind === "timeout") return { msg: "O código demorou demais e o ARGO interrompeu.", hint: "Algum laço nunca termina, ou o algoritmo testa combinações demais." };
  return { msg: err.msg, hint: "" };
}
async function runAll(){

    if (k>0) await wait(300);
    await wait(30);
    if (myRun !== runId) return;
    const { sim, out, err, res } = rodar(m, k, code, 7 + k);
    if (err && err.kind === "compile"){ allOk = false; const { msg, hint } = explain(err); mapStatus[k] = false; renderMaps(); fail(msg, hint); break; }
    const done = sim ? await animate(sim.trace) : true;
    if (myRun !== runId) return;

    if (!done){ allOk = false; fbEl.innerHTML = `<div class="feedback bad"><b>Missão abortada</b>Ajuste o código e envie de novo.</div>`; break; }
    if (err){ const { msg, hint } = explain(err); mapStatus[k] = false; renderMaps(); allOk = false; fail(`${m.casos.length>1?`${casoLabel(m,k)}: `:""}${msg}`, hint); break; }

function syncGutter(){
  if (!codeEl) return;

  gutterEl.textContent = Array.from({length:n},(_,i)=>i+1).join("\n");
  codeEl.style.height = "auto"; codeEl.style.height = codeEl.scrollHeight+"px";

function insert(t, back=0){
  codeEl.setRangeText(t, codeEl.selectionStart, codeEl.selectionEnd, "end");

}
function newline(){
  const v = codeEl.value, s = codeEl.selectionStart;

}
function dedent(){
  const v = codeEl.value, s = codeEl.selectionStart, ls = v.lastIndexOf("\n", s-1)+1;
  const sp = v.slice(ls).match(/^ {1,4}/);
  if (sp){ codeEl.setRangeText("", ls, ls+sp[0].length, "end"); const p = Math.max(ls, s-sp[0].length); codeEl.setSelectionRange(p,p); codeEl.dispatchEvent(new Event("input")); }
}

    if (e.key==="Tab"){ e.preventDefault(); e.shiftKey ? dedent() : insert("    "); return; }
    if (e.key==="Enter" && !e.isComposing){ e.preventDefault(); newline(); return; }
    if (e.key==="Backspace" && s===en){
      const before = v.slice(v.lastIndexOf("\n", s-1)+1, s);
      if (before.length && /^ +$/.test(before)){ e.preventDefault(); const k = (before.length-1)%4+1; codeEl.setRangeText("", s-k, s, "end"); codeEl.dispatchEvent(new Event("input")); }
    }

}
const KEYS = [["⇥","tab"],["⇤","dedent"],[":",":"],["( )","()",1],["[ ]","[]",1],["{ }","{}",1],["\" \"","\"\"",1],["_","_"],["=","="],["==","=="],["!=","!="],["+=","+="],[",",", "],[".","."],["self","self."],["return","return "],["yield","yield "],["for","for  in :",5],["if","if :",1],["def","def ():",3],["↵","enter"]];
